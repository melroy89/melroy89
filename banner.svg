<svg xmlns="http://www.w3.org/2000/svg" width="880" height="280" viewBox="0 0 1280 407.273" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Melroy van den Berg — open-source developer and maintainer</title>
  <desc id="description">Ivory lettering on charcoal beside a copper M monogram drawn into a branching commit graph. Commits start at the M, split at shared junctions, pause briefly at project nodes and travel through Mbin, WineGUI, Fastify MariaDB, BCH Explorer, LibreWeb and Angie Guardian. Open branches carry commits beyond the banner, representing wider open-source contributions.</desc>
  <defs>
    <clipPath id="frame"><rect width="1280" height="407.273" rx="8"/></clipPath>
    <path id="monogram" d="M838 250V122L936 218 1034 122V250"/>
    <path id="mbin-branch" d="M1034 122V92Q1034 64 1062 64H1280"/>
    <path id="wine-branch" d="M1034 250Q1034 282 1066 282H1280"/>
    <path id="fastify-branch" d="M838 250V276Q838 308 806 308H674Q646 308 646 336V440"/>
    <!-- Complete outward routes share geometry and speed, so their packets split at junctions. -->
    <path id="flow-bch" d="M936 218L838 122V108Q838 80 810 80H772Q744 80 744 52V-20"/>
    <path id="flow-libreweb" d="M936 218L838 122V108Q838 80 810 80H772Q744 80 744 52V178Q744 206 772 206H790"/>
    <path id="flow-fastify" d="M936 218L838 122V276Q838 308 806 308H674Q646 308 646 336V440"/>
    <path id="flow-mbin" d="M936 218L1034 122V92Q1034 64 1062 64H1300"/>
    <path id="flow-winegui" d="M936 218L1034 122V250Q1034 282 1066 282H1300"/>
    <path id="flow-angie" d="M936 218L1034 122V250Q1034 282 1066 282H1144V316Q1144 344 1172 344H1300"/>
    <path id="flow-upstream" d="M936 218L1034 122V92Q1034 64 1062 64H1156Q1184 64 1184 36V-20"/>
    <path id="flow-downstream" d="M936 218V380Q936 408 964 408Q984 408 984 428V440"/>
    <style>
      :root { --bg: #1b1c1a; --fg: #f1eee6; --muted: #acaea5; --line: #575a51; --accent: #ff805c; }
      .sans { font-family: 'Segoe UI', Ubuntu, Arial, sans-serif; }
      .mono { font-family: 'DejaVu Sans Mono', Consolas, monospace; }
      .ink { fill: var(--fg); }
      .muted { fill: var(--muted); }
      .branch { stroke: var(--line); stroke-width: 2; }
      .node { fill: var(--bg); stroke: var(--fg); stroke-width: 2; }
      .mobile-identity { display: none; }
      @media (max-width: 600px) {
        .desktop-identity, .project-graph { display: none; }
        .mobile-identity { display: inline; }
      }
      @media (prefers-reduced-motion: reduce) { .flow-animation { display: none; } }
    </style>
  </defs>
  <g clip-path="url(#frame)">
    <path fill="var(--bg)" d="M0 0h1280v407.273H0z"/>

    <!-- Editorial identity: the name carries the hierarchy, with no UI chrome. -->
    <g class="sans desktop-identity">
      <text x="52" y="55" class="mono muted" font-size="18" letter-spacing="1"><tspan fill="var(--accent)">/</tspan> melroy89</text>
      <text x="46" y="165" class="ink" font-size="112" font-weight="700" letter-spacing="-3">Melroy</text>
      <text x="52" y="223" class="ink" font-size="48" letter-spacing="-1.8">van den Berg</text>
      <text x="54" y="274" class="muted" font-size="23">Developer. Maintainer. Tinkerer.</text>
      <path d="M54 323H550" stroke="var(--line)" stroke-opacity=".65"/>
      <text x="54" y="357" class="mono ink" font-size="20.2"><tspan>Open source</tspan><tspan dx="16" class="muted">/</tspan><tspan dx="16">Linux</tspan><tspan dx="16" class="muted">/</tspan><tspan dx="16">Fediverse</tspan></text>
    </g>

    <!-- A simpler identity keeps text legible when embedded at narrow widths. -->
    <g class="sans mobile-identity">
      <text x="52" y="58" class="mono muted" font-size="32"><tspan fill="var(--accent)">/</tspan> melroy89</text>
      <text x="46" y="193" class="ink" font-size="144" font-weight="700" letter-spacing="-3">Melroy</text>
      <text x="52" y="267" class="ink" font-size="64" letter-spacing="-1.8">van den Berg</text>
      <text x="54" y="332" class="muted" font-size="40">Developer. Maintainer.</text>
      <text x="54" y="383" class="muted" font-size="40">Tinkerer.</text>
      <use href="#monogram" stroke="var(--accent)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    </g>


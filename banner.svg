<svg xmlns="http://www.w3.org/2000/svg" width="880" height="280" viewBox="0 0 1280 407.273" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Melroy van den Berg — open-source developer and maintainer</title>
  <desc id="description">Ivory lettering on charcoal beside a copper M monogram drawn into a branching commit graph. Commits start at the M, split at shared junctions and travel outward to Mbin, WineGUI, Fastify MariaDB, BCH Explorer, LibreWeb and Angie Guardian.</desc>
  <defs>
    <clipPath id="frame"><rect width="1280" height="407.273" rx="8"/></clipPath>
    <path id="monogram" d="M838 250V122L936 218 1034 122V250"/>
    <path id="mbin-branch" d="M1034 122V92Q1034 64 1062 64H1280"/>
    <path id="wine-branch" d="M1034 250Q1034 282 1066 282H1280"/>
    <path id="fastify-branch" d="M838 250V276Q838 308 806 308H674"/>
    <!-- Complete outward routes share geometry and speed, so their packets split at junctions. -->
    <path id="flow-bch" d="M936 218L838 122V108Q838 80 810 80H772Q744 80 744 52V40"/>
    <path id="flow-libreweb" d="M936 218L838 122V108Q838 80 810 80H772Q744 80 744 52V178Q744 206 772 206H790"/>
    <path id="flow-fastify" d="M936 218L838 122V276Q838 308 806 308H780"/>
    <path id="flow-mbin" d="M936 218L1034 122V92Q1034 64 1062 64H1100"/>
    <path id="flow-winegui" d="M936 218L1034 122V250Q1034 282 1066 282H1144"/>
    <path id="flow-angie" d="M936 218L1034 122V250Q1034 282 1066 282H1144V316Q1144 344 1172 344H1216"/>
    <style>
      :root { --bg: #1b1c1a; --fg: #f1eee6; --muted: #acaea5; --line: #575a51; --accent: #ff805c; }
      .sans { font-family: 'Segoe UI', Ubuntu, Arial, sans-serif; }
      .mono { font-family: 'DejaVu Sans Mono', Consolas, monospace; }
      .ink { fill: var(--fg); }
      .muted { fill: var(--muted); }
      .branch { stroke: var(--line); stroke-width: 2; }
      .node { fill: var(--bg); stroke: var(--fg); stroke-width: 2; }
      @media (prefers-reduced-motion: reduce) { .flow-animation { display: none; } }
    </style>
  </defs>
  <g clip-path="url(#frame)">
    <path fill="var(--bg)" d="M0 0h1280v407.273H0z"/>

    <!-- Editorial identity: the name carries the hierarchy, with no UI chrome. -->
    <g class="sans">
      <text x="52" y="55" class="mono muted" font-size="18" letter-spacing="1"><tspan fill="var(--accent)">/</tspan> melroy89</text>
      <text x="46" y="165" class="ink" font-size="112" font-weight="700" letter-spacing="-5">Melroy<tspan fill="var(--accent)">.</tspan></text>
      <text x="52" y="223" class="ink" font-size="48" letter-spacing="-1.8">van den Berg</text>
      <text x="54" y="274" class="muted" font-size="23">Open-source Developer. Maintainer. Tinkerer.</text>
      <path d="M54 323H550" stroke="var(--line)" stroke-opacity=".65"/>
      <text x="54" y="357" class="mono ink" font-size="20.2"><tspan>Open source</tspan><tspan dx="16" class="muted">/</tspan><tspan dx="16">Linux</tspan><tspan dx="16" class="muted">/</tspan><tspan dx="16">Fediverse</tspan></text>
    </g>

    <!-- The M is itself a branch: a personal mark with a commit-graph structure. -->
    <g class="branch" stroke-linecap="round" stroke-linejoin="round">
      <path d="M744-20V52Q744 80 772 80H810Q838 80 838 108V122"/>
      <path d="M744 52V178Q744 206 772 206H790"/>
      <path d="M1184-20V36Q1184 64 1156 64"/>
      <path d="M1144 282V316Q1144 344 1172 344H1280"/>
      <path d="M936 218V380Q936 408 964 408"/>
      <use href="#mbin-branch"/>
      <use href="#wine-branch"/>
      <use href="#fastify-branch"/>
    </g>
    <use href="#monogram" stroke="var(--accent)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

    <g class="node">
      <circle cx="744" cy="40" r="7"/>
      <circle cx="790" cy="206" r="7"/>
      <circle cx="1100" cy="64" r="7"/>
      <circle cx="1224" cy="64" r="5"/>
      <circle cx="1144" cy="282" r="7"/>
      <circle cx="780" cy="308" r="7"/>
      <circle cx="936" cy="372" r="5"/>
      <circle cx="1216" cy="344" r="7"/>
    </g>
    <g fill="var(--bg)" stroke="var(--accent)" stroke-width="3">
      <circle cx="838" cy="122" r="7"/>
      <circle cx="936" cy="218" r="7"/>
      <circle cx="1034" cy="122" r="7"/>
    </g>
    <!-- One eight-second emission cycle, travelling at 110 viewBox units per second.
         Shared route prefixes overlap until a real fork; each destination lights on arrival. -->
    <g class="flow-animation">
      <circle id="commit-bch" r="4.5" fill="var(--fg)" stroke="var(--accent)" stroke-width="1.5" opacity="0">
        <animateMotion dur="8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.331917;1">
          <mpath href="#flow-bch"/>
        </animateMotion>
        <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.025;0.331917;0.371917;1"/>
      </circle>
      <circle cx="744" cy="40" r="7" fill="none" stroke="var(--accent)" stroke-width="2.5" opacity="0">
        <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.306917;0.331917;0.381917;0.431917;1"/>
      </circle>
      <circle id="commit-libreweb" r="4.5" fill="var(--fg)" stroke="var(--accent)" stroke-width="1.5" opacity="0">
        <animateMotion dur="8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.533565;1">
          <mpath href="#flow-libreweb"/>
        </animateMotion>
        <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.025;0.533565;0.573565;1"/>
      </circle>
      <circle cx="790" cy="206" r="7" fill="none" stroke="var(--accent)" stroke-width="2.5" opacity="0">
        <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.508565;0.533565;0.583565;0.633565;1"/>
      </circle>
      <circle id="commit-fastify" r="4.5" fill="var(--fg)" stroke="var(--accent)" stroke-width="1.5" opacity="0">
        <animateMotion dur="8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.419465;1">
          <mpath href="#flow-fastify"/>
        </animateMotion>
        <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.025;0.419465;0.459465;1"/>
      </circle>
      <circle cx="780" cy="308" r="7" fill="none" stroke="var(--accent)" stroke-width="2.5" opacity="0">
        <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.394465;0.419465;0.469465;0.519465;1"/>
      </circle>
      <circle id="commit-mbin" r="4.5" fill="var(--fg)" stroke="var(--accent)" stroke-width="1.5" opacity="0">
        <animateMotion dur="8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.284814;1">
          <mpath href="#flow-mbin"/>
        </animateMotion>
        <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.025;0.284814;0.324814;1"/>
      </circle>
      <circle cx="1100" cy="64" r="7" fill="none" stroke="var(--accent)" stroke-width="2.5" opacity="0">
        <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.259814;0.284814;0.334814;0.384814;1"/>
      </circle>
      <circle id="commit-winegui" r="4.5" fill="var(--fg)" stroke="var(--accent)" stroke-width="1.5" opacity="0">
        <animateMotion dur="8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.449011;1">
          <mpath href="#flow-winegui"/>
        </animateMotion>
        <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.025;0.449011;0.489011;1"/>
      </circle>
      <circle cx="1144" cy="282" r="7" fill="none" stroke="var(--accent)" stroke-width="2.5" opacity="0">
        <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.424011;0.449011;0.499011;0.549011;1"/>
      </circle>
      <circle id="commit-angie" r="4.5" fill="var(--fg)" stroke="var(--accent)" stroke-width="1.5" opacity="0">
        <animateMotion dur="8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.589295;1">
          <mpath href="#flow-angie"/>
        </animateMotion>
        <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.025;0.589295;0.629295;1"/>
      </circle>
      <circle cx="1216" cy="344" r="7" fill="none" stroke="var(--accent)" stroke-width="2.5" opacity="0">
        <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.564295;0.589295;0.639295;0.689295;1"/>
      </circle>
    </g>
    <g class="sans ink" font-size="20" font-weight="600">
      <text x="1100" y="103" text-anchor="middle">Mbin</text>
      <text x="1144" y="260" text-anchor="middle">WineGUI</text>
      <text x="780" y="346" text-anchor="middle">Fastify MariaDB</text>
      <text x="766" y="47">BCH Explorer</text>
      <text x="790" y="244" text-anchor="end">LibreWeb</text>
      <text x="1216" y="382" text-anchor="end">Angie Guardian</text>
    </g>
    <rect x=".5" y=".5" width="1279" height="406.273" rx="7.5" stroke="var(--fg)" stroke-opacity=".08"/>
  </g>
</svg>
